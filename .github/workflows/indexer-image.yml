name: Indexer image

on:
  push:
    branches: [main]
    paths:
      - "apps/indexer/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - ".github/workflows/indexer-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexer-image
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish the indexer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/indexer/Dockerfile
          push: true
          tags: |
            ghcr.io/comatocard/comatocard-indexer:main
            ghcr.io/comatocard/comatocard-indexer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
