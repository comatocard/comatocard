[workspace]
resolver = "3"
members = [
    "apps/indexer",
    "contracts/common",
    "contracts/factory",
    "contracts/mock-ft",
    "contracts/registry",
    "contracts/testkit",
    "contracts/vault",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/comatocard/comatocard"

[workspace.dependencies]
# Without default features: near-sdk would install wee_alloc, which is unmaintained
# (RUSTSEC-2022-0054), as the wasm allocator; Rust's own allocator is used instead.
near-sdk = { version = "5.30.1", default-features = false }
near-contract-standards = "5.30.1"
near-sandbox = "0.4.0"
near-api = "0.8.7"
tokio = { version = "1", features = ["full"] }
serde = "1"
serde_json = "1"
testkit = { path = "contracts/testkit" }
comatocard-common = { path = "contracts/common" }
testresult = "0.4.2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Rustacean hygiene, enforced instead of written down: every exception states its reason, and
# production code returns errors instead of panicking on them (tests may unwrap, see clippy.toml).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
must_use_candidate = "allow"
needless_pass_by_value = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Native server binaries (the indexer): full speed and unwinding panics, unlike the size-tuned
# contract profile above. Used by `apps/indexer/Dockerfile`.
[profile.server]
inherits = "release"
opt-level = 3
lto = "thin"
panic = "unwind"
