[package]
name = "comatocard-indexer"
description = "Indexes Comatocard events from NEAR into Postgres and serves REST and WebSocket APIs"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-graphql = { version = "7.2.1", default-features = false, features = ["graphiql"] }
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
near-sdk = { workspace = true, features = ["non-contract-usage"] }
registry = { version = "0.1.0", path = "../../contracts/registry" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { workspace = true, features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
vault = { version = "0.1.0", path = "../../contracts/vault" }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres", "blocking"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
