services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: comatocard
      POSTGRES_PASSWORD: comatocard
      POSTGRES_DB: comatocard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comatocard"]
      interval: 5s
      retries: 10

  indexer:
    build:
      context: ../..
      dockerfile: apps/indexer/Dockerfile
    environment:
      NETWORK: testnet
      FACTORY_ID: factory.comatocard.testnet
      REGISTRY_ID: registry.comatocard.testnet
      DATABASE_URL: postgres://comatocard:comatocard@postgres:5432/comatocard
      NEARDATA_API_KEY: ${NEARDATA_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
