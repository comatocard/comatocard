services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: comatocard
      POSTGRES_PASSWORD: comatocard
      POSTGRES_DB: comatocard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comatocard"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
