pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

output:
  - failure
