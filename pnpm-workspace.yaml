packages:
  - apps/*
  - packages/*
  - contracts/*

allowBuilds:
  esbuild: true
  lefthook: true

# apps/docs runs Nextra 2.13.4 and twin.macro 3.1.0, the latest releases of those lines; they
# still depend on these. Remove once the docs site moves to Nextra 4 (App Router).
allowedDeprecatedVersions:
  intersection-observer: "0.12"
  lodash.get: "4"

savePrefix: ""

# near-connect-hooks 1.1.6 depends on @hot-labs/near-connect ^0.11; one copy at 0.12.0, which adds
# only gas-key APIs and keeps signDelegateActions.
overrides:
  "@hot-labs/near-connect": "0.12.0"
