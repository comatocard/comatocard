packages:
  - apps/*
  - packages/*
  - contracts/*

allowBuilds:
  esbuild: true
  lefthook: true

# apps/docs runs Nextra 2.13.4 and twin.macro 3.1.0, the latest releases of those lines; they
# still depend on these. Remove once the docs site moves to Nextra 4 (App Router).
allowedDeprecatedVersions:
  intersection-observer: "0.12"
  lodash.get: "4"

savePrefix: ""
