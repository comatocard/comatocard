packages:
  - apps/*
  - packages/*
  - contracts/*

allowBuilds:
  esbuild: true
  lefthook: true

# Nextra 4.6.1, the latest release, renders LaTeX through better-react-mathjax, which still
# depends on mathjax-full 3. Remove once Nextra moves to MathJax 4.
allowedDeprecatedVersions:
  mathjax-full: "3"

savePrefix: ""

# near-connect-hooks 1.1.6 depends on @hot-labs/near-connect ^0.11; one copy at 0.12.0, which adds
# only gas-key APIs and keeps signDelegateActions.
overrides:
  "@hot-labs/near-connect": "0.12.0"
